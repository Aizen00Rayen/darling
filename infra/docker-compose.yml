# Local dev SMTP for the DARLING* app: Mailpit catches every mail (SMTP on 1025, inbox UI on 8025).
#   Start:  docker compose -p darling -f infra/docker-compose.yml up -d
#   Stop:   docker compose -p darling -f infra/docker-compose.yml down
# Set SMTP_URL=smtp://localhost:1025 in .env to use it.
name: darling

services:
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
