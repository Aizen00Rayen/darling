# Local infrastructure for the DARLING* platform.
#   Start:  pnpm infra:up      (docker compose -p darling -f infra/docker-compose.yml up -d --wait)
#   Stop:   pnpm infra:down    (keeps the darling_pgdata volume and all data)
#   Reset:  docker compose -p darling -f infra/docker-compose.yml down -v
#           (deletes the volume; init.sql re-runs on the next `pnpm infra:up`)
name: darling

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - darling_pgdata:/var/lib/postgresql/data
      # Runs once, as the superuser, when the data volume is empty.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  darling_pgdata:
    name: darling_pgdata
